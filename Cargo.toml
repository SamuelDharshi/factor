[workspace]
resolver = "3"
members = ["contracts/vault", "contracts/musdc", "contracts/factor", "contracts/registry", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/SamuelDharshi/factor"

[workspace.dependencies]
near-sdk = { version = "=5.30.1", features = ["global-contracts"] }
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
