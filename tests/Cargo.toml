[package]
name = "factor-integration"
description = "Sandbox integration tests for FACTOR (near-sandbox + near-api)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
near-api = "=0.8.7"
near-sandbox = "=0.4.1"
tokio = { version = "1.43", features = ["full"] }
testresult = "0.4.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
